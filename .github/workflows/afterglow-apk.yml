name: Build Afterglow APK
on:
  workflow_dispatch:
  push:
    paths: ["afterglow/**", ".github/workflows/afterglow-apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: afterglow } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: node tools/patch-android.js
      - name: App icon
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f android/app/src/main/res/$d/$f ] && cp www/icons/icon-192.png android/app/src/main/res/$d/$f || true
            done
          done
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: afterglow/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: afterglow-apk
          path: afterglow/android/app/build/outputs/apk/debug/*.apk
