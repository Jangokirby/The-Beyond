<div id="app">
  <section id="screen-camp" class="screen"><div id="camp-root"></div></section>

  <!-- ============================================================ GAME -->
  <section id="screen-game" class="screen" hidden>
    <header id="topbar">
      <div class="where">
        <b id="loc-name">Kanda</b>
        <span id="loc-jp" class="jp" lang="ja"></span>
        <span id="loc-light" class="light-badge"></span>
      </div>
      <nav class="tools">
        <button class="icon-btn labeled" id="btn-case" aria-label="Case file"><span class="ico jp" aria-hidden="true">卷</span><span class="ico en" aria-hidden="true">▤</span><span class="txt">Case file</span><span class="count">0</span></button>
        <button class="icon-btn labeled" id="btn-powers" aria-label="Powers"><span class="ico jp" aria-hidden="true">力</span><span class="ico en" aria-hidden="true">✦</span><span class="txt">Powers</span></button>
        <button class="icon-btn labeled" id="btn-settings" aria-label="Settings"><span class="ico jp" aria-hidden="true">設</span><span class="ico en" aria-hidden="true">⚙</span><span class="txt">Settings</span></button>
      </nav>
    </header>
    <div id="scene">
      <div id="frame">
        <img id="bg" alt="">
        <canvas id="fx" aria-hidden="true"></canvas>
        <div id="hotspots" aria-label="Things you can examine"></div>
        <div id="cast"></div>
      </div>
      <div id="board" hidden></div>
    </div>
    <section id="panel" aria-label="Story">
      <div id="story" aria-live="polite"></div>
      <div id="choices"></div>
    </section>
    <footer id="party" aria-label="Your agents"></footer>
  </section>
</div>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
