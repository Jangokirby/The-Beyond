<!doctype html><meta charset="utf-8"><title>Stills</title><body style="margin:0;background:#000"><script type="module">
import * as K from "./kit.js";
/* Renders a room from the middle, looking north, east, south and west, at eye height. For each view: a colour picture, a depth picture
   (white = near, black = far, the kind image-to-image tools take as a guide) and where the room's marks fall on the picture (percent).
   window.STILLS(layout, spots, W, H) */
const THREE = K.THREE;
window.STILLS = async (layout, spots = {}, W = 1920, H = 1200) => {
  await K.loadPieces(); await K.prepare(layout);
  const { scene } = K.build(layout, { firstPerson: true }), canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const R = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.25; R.setPixelRatio(1); R.setSize(W, H, false);
  const far = Math.max(layout.w, layout.h) * 1.15, cam = new THREE.PerspectiveCamera(72, W / H, .3, far + 5), eye = [layout.w / 2, 1.55, layout.h / 2]; cam.position.set(...eye);
  const depthMat = new THREE.ShaderMaterial({ uniforms: { uN: { value: .5 }, uF: { value: far } }, vertexShader: "varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }", fragmentShader: "uniform float uN; uniform float uF; varying float vD; void main(){ float d = clamp((vD - uN) / (uF - uN), 0.0, 1.0); gl_FragColor = vec4(vec3(1.0 - d), 1.0); }" });
  const where = (label, q) => { let best = null, bd = 1e9; for (const d of layout.doors || []) { const dd = Math.hypot(d.x - q[0], d.z - q[1]); if (dd < bd) { bd = dd; best = [d.x, 1.15, d.z]; } } if (best && bd < 1.7) return best; best = null; bd = 1e9; for (const p of layout.props || []) { const dd = Math.hypot(p.x - q[0], p.z - q[1]); const def = K.CATALOG[p.t]; if (def && def.block && dd < bd) { bd = dd; best = [p.x, .95, p.z]; } } if (best && bd < 2.4 && !/^talk/i.test(label)) return best; return [q[0], /^talk/i.test(label) ? 1.2 : 1.0, q[1]]; };
  const out = [], v = new THREE.Vector3(), names = ["north", "east", "south", "west"];
  for (let f = 0; f < 4; f++) {
    cam.rotation.y = -f * Math.PI / 2; cam.updateMatrixWorld(true); scene.overrideMaterial = null; R.render(scene, cam); const color = canvas.toDataURL("image/png");
    depthMat.uniforms.uF.value = Math.max(3.5, [layout.h / 2, layout.w / 2, layout.h / 2, layout.w / 2][f] * 1.35);   /* the far end of the range is this wall: the contrast is spent on the room, not on empty distance */
    scene.overrideMaterial = depthMat; R.toneMapping = THREE.NoToneMapping; R.render(scene, cam); const depth = canvas.toDataURL("image/png"); scene.overrideMaterial = null; R.toneMapping = THREE.ACESFilmicToneMapping;
    const marks = []; for (const [label, q] of Object.entries(spots)) { const w = where(label, q); v.set(...w).project(cam); if (v.z < 1 && Math.abs(v.x) < 1 && Math.abs(v.y) < 1) marks.push({ label, x: Math.round((v.x * .5 + .5) * 1000) / 10, y: Math.round((-v.y * .5 + .5) * 1000) / 10 }); }
    out.push({ face: names[f], color, depth, marks });
  }
  return out;
};

/* What the 3D room actually puts on each wall, in plain words, most important first (for the repaint tool's prompt).
   A prop belongs to the wall it stands against (within 1.3 m); a free-standing one goes to the wall it lies towards from the middle of the room. */
const PLAIN = { bookshelf: ["a tall bookcase full of leather books", "tall bookcases full of leather books"], bed_iron: ["an iron bed", "iron beds"], bed_double: ["a double bed", "double beds"], cot: ["a camp cot", "camp cots"], desk: ["a heavy desk", "heavy desks"], table_long: ["a long table", "long tables"], table_round: ["a round table", "round tables"], counter: ["a counter", "counters"], filing_cabinet: ["a metal filing cabinet", "metal filing cabinets"], crate_stack: ["a stack of crates", "stacks of crates"], crate_med: ["a medical crate", "medical crates"], stove: ["an iron stove", "iron stoves"], fireplace: ["a fireplace", "fireplaces"], lamp_table: ["a lamp on a table", "lamps on tables"], lamp_floor: ["a standing lamp", "standing lamps"], pillar: ["a stone pillar", "stone pillars"], sink: ["a sink", "sinks"], gramophone: ["a gramophone", "gramophones"], wardrobe: ["a wardrobe", "wardrobes"], locker: ["a metal locker", "metal lockers"], stretcher: ["a stretcher", "stretchers"] };
const NUM = ["", "a", "two", "three", "four", "five", "six", "seven", "eight"];
const plain = (t, n) => { const d = K.CATALOG[t], p = PLAIN[t]; if (p) return n > 1 ? `${NUM[Math.min(n, 8)]} ${p[1].replace(/^(a|an) /, "")}` : p[0]; const nm = String((d && d.name) || t).replace(/[_/]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase(); return n > 1 ? `${NUM[Math.min(n, 8)]} ${nm}${/s$/.test(nm) ? "" : "s"}` : (/^[aeiou]/.test(nm) ? "an " : "a ") + nm; };
window.WALLS = async (layout) => {
  await K.loadPieces(); const w = layout.w, h = layout.h, W = { north: [], east: [], south: [], west: [] };
  const wallOf = (x, z, near) => { const d = { north: z, south: h - z, west: x, east: w - x }, m = Object.entries(d).sort((a, b) => a[1] - b[1])[0]; if (m[1] < near) return m[0]; const dx = x - w / 2, dz = z - h / 2; return Math.abs(dz) >= Math.abs(dx) ? (dz < 0 ? "north" : "south") : (dx < 0 ? "west" : "east"); };
  const edge = (o) => (o.axis === "h" ? (o.z < h / 2 ? "north" : "south") : (o.x < w / 2 ? "west" : "east"));
  const fixed = { door: {}, window: {} }; for (const [kind, list] of [["door", layout.doors || []], ["window", layout.windows || []]]) for (const o of list) { const f = edge(o), k = kind === "door" && o.w >= 1.6 ? "wide" : "plain"; (fixed[kind][f] = fixed[kind][f] || { wide: 0, plain: 0 })[k]++; }
  const groups = { north: {}, east: {}, south: {}, west: {} };
  for (const p of layout.props || []) { const d = K.CATALOG[p.t]; if (!d || /rug|carpet/.test(p.t)) continue; const f = wallOf(p.x, p.z, 1.3), g = (groups[f][p.t] = groups[f][p.t] || { n: 0, area: (d.size[0] * d.size[1]) || .2, minor: /^(chair|stool|candle|barrel|crate)$/.test(p.t) }); g.n++; }
  const out = {};
  for (const f of Object.keys(W)) {
    const items = [], dd = fixed.door[f], ww = fixed.window[f];
    if (dd) { if (dd.plain) items.push(dd.plain > 1 ? `${NUM[dd.plain]} doors` : "a door"); if (dd.wide) items.push(dd.wide > 1 ? `${NUM[dd.wide]} wide double doors` : "a wide double door"); }
    const objs = Object.entries(groups[f]).sort((a, b) => (a[1].minor - b[1].minor) || (b[1].area * b[1].n - a[1].area * a[1].n)).map(([t, g]) => plain(t, g.n));
    items.push(...objs); if (ww) items.push(ww.plain + ww.wide > 1 ? `${NUM[ww.plain + ww.wide]} windows` : "a window");
    out[f] = items.length ? items.join(", ") : "bare wall";
  }
  /* explicit instructions: what must stay where it is (seen from inside, facing the wall) and what must not be invented */
  const along = (f, x, z) => { const t = f === "north" ? x / w : f === "south" ? 1 - x / w : f === "east" ? z / h : 1 - z / h; return t < .38 ? "on the left" : t > .62 ? "on the right" : "in the centre"; };
  const keep = { north: [], east: [], south: [], west: [] }, forbid = { north: [], east: [], south: [], west: [] };
  const wallFace = (o) => (o.axis === "h" ? (o.z < h / 2 ? "north" : "south") : (o.x < w / 2 ? "west" : "east"));
  for (const [kind, list] of [["door", layout.doors || []], ["window", layout.windows || []]]) for (const o of list) { const f = wallFace(o); keep[f].push(`${o.w >= 1.6 && kind === "door" ? "a wide double door" : "a " + kind} ${along(f, o.x, o.z)} of the wall`); }
  for (const f of Object.keys(keep)) { if (!(layout.doors || []).some((o) => wallFace(o) === f)) forbid[f].push("doors"); if (!(layout.windows || []).some((o) => wallFace(o) === f)) forbid[f].push("windows"); }
  const seen = {}; for (const p of layout.props || []) { const d = K.CATALOG[p.t]; if (!d || /rug|carpet|chair|stool|candle|crate$|barrel/.test(p.t)) continue; const f = wallOf(p.x, p.z, 1.3), nearWall = Math.min(p.x, w - p.x, p.z, h - p.z) < 1.3; if (!nearWall) continue; const k = f + p.t; (seen[k] = seen[k] || { f, t: p.t, n: 0, x: 0, z: 0 }); seen[k].n++; seen[k].x += p.x; seen[k].z += p.z; }
  for (const g of Object.values(seen)) if (keep[g.f].length < 6) keep[g.f].push(g.n > 1 ? `${plain(g.t, g.n)} along the wall` : `${plain(g.t, 1)} ${along(g.f, g.x, g.z)}`);
  for (const f of Object.keys(forbid)) { const lit = (layout.props || []).some((p) => /fireplace|stove/.test(p.t) && wallOf(p.x, p.z, 1.3) === f); if (!lit) forbid[f].push("fireplaces"); }
  const light = [...new Set((layout.props || []).filter((p) => K.CATALOG[p.t] && K.CATALOG[p.t].light).map((p) => plain(p.t, 1)))];
  const rug = (layout.props || []).some((p) => /rug|carpet/.test(p.t));
  return { walls: out, keep, forbid, lights: light, rug };
};
window.READY = true;
</script>
